[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "git-pullreqs"
version = "0.1.0"
description = "git pullreqs: adds stable custom PR IDs (1010+) on top of the native PR IDs"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
git-pullreqs = "pullreqs.cli:main"

[tool.setuptools]
packages = ["pullreqs"]

[project.scripts]
git-pullreqs = "pullreqs.cli:main"
git-drop = "pullreqs.drop:main"